<!DOCTYPE html>
<html lang="my" class="dark not-authed">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yogi App</title>

  <!-- 💡 PWA Web App Manifest & Theme Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yogi App">

  <script>
    (function () {
      var token = localStorage.getItem('yogi_auth_token');
      var expiresAt = Number(localStorage.getItem('yogi_token_expires_at') || 0);
      var valid = token && expiresAt && Date.now() < expiresAt;
      document.documentElement.className = valid ? 'dark is-authed' : 'dark not-authed';
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <!-- 💡 Tailwind Runtime Engine (Ensures GitHub Pages renders all utility classes 100%) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="css/fontawesome.min.css">
  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    html.is-authed #login-overlay { display: none !important; }
    html.is-authed #erp-workspace { display: flex !important; }
    html.not-authed #login-overlay { display: flex !important; }
    html.not-authed #erp-workspace { display: none !important; }
  </style>
</head>

<body class="bg-[#090d16] font-sans flex h-screen w-screen overflow-hidden text-slate-300 select-none">

  <!-- Login Overlay -->
  <div id="login-overlay" class="fixed inset-0 bg-[#070a12]/95 backdrop-blur-md z-[100] flex items-center justify-center p-4">
    <div class="login-card-box relative space-y-6">
      <div class="text-center relative z-10">
        <div class="inline-flex items-center justify-center p-4 rounded-2xl bg-gradient-to-b from-amber-500/20 to-amber-600/10 border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-3">
          <i class="fa-solid fa-dharmachakra text-4xl text-amber-400 filter drop-shadow-[0_0_12px_rgba(245,158,11,0.6)]"></i>
        </div>
        <h2 class="text-2xl font-black tracking-tight mb-1 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 bg-clip-text text-transparent">Zoom ပဋ္ဌာန်း မိသားစု</h2>
        <p class="text-[11px] font-extrabold uppercase tracking-[0.25em] text-amber-300/80 pb-3 border-b border-amber-500/20">တရားဆွေးနွေးပွဲ · ယောဂီများ စီမံခန့်ခွဲမှု</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs text-left relative z-10">
        <div>
          <label class="block font-bold text-[11px] text-amber-200/90 uppercase tracking-widest mb-1.5">Select Role / User</label>
          <select id="login-username" required
            class="w-full p-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-xs text-slate-100 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/25 transition font-bold cursor-pointer">
          </select>
        </div>
        <div>
          <label class="block font-bold text-[11px] text-amber-200/90 uppercase tracking-widest mb-1.5">Password</label>
          <input type="password" id="login-password" required placeholder="လျှို့ဝှက်နံပါတ် ရိုက်ထည့်ပါ..."
            class="w-full p-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-xs text-slate-100 placeholder:text-slate-600 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/25 transition">
        </div>
        <div id="login-error" class="hidden text-rose-400 font-semibold text-[11px] bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-xl text-center"></div>
        <button type="submit"
          class="w-full py-3.5 mt-2 bg-gradient-to-r from-amber-500 via-amber-600 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 text-xs tracking-wider active:scale-[0.99]">
          <span>စနစ်အတွင်းသို့ ဝင်မည်</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500 relative z-10">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
          <span class="font-bold text-slate-400">System Ready</span>
        </div>
        <span class="font-mono text-amber-400/80 font-extrabold">v1.0</span>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="erp-workspace" class="hidden h-screen w-screen flex flex-row overflow-hidden bg-[#090d16]">
    
    <!-- Left Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-[#0c1220] border-r border-amber-500/20 flex flex-col h-full shrink-0 z-30 transition-transform duration-300 -translate-x-full md:translate-x-0 fixed md:relative top-0 left-0 bottom-0 shadow-2xl">
      <div class="h-[64px] px-4 border-b border-amber-500/20 flex items-center justify-between bg-[#0e172a] shrink-0">
        <div class="flex items-center gap-2.5 font-black text-xs sm:text-sm text-amber-400 min-w-0 overflow-hidden">
          <i class="fa-solid fa-dharmachakra text-amber-400 text-base shrink-0 filter drop-shadow-[0_0_6px_rgba(245,158,11,0.4)]"></i>
          <span class="truncate font-extrabold whitespace-nowrap tracking-wide">Zoom ယောဂီစာရင်း</span>
        </div>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 transition p-1.5 rounded-lg shrink-0 hover:bg-slate-800/60" title="Logout">
          <i class="fa-solid fa-power-off text-xs"></i>
        </button>
      </div>
      <nav class="flex-1 px-2.5 py-3 space-y-1.5 overflow-y-auto" id="sidebar-nav"></nav>
    </aside>

    <div id="sidebar-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-950/80 z-20 hidden md:hidden"></div>

    <!-- Right Main Workspace Container -->
    <div class="flex-1 flex flex-col h-full min-w-0 overflow-hidden bg-[#090d16]">
      <header class="h-[64px] bg-[#0c1220] border-b border-amber-500/20 px-4 md:px-6 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center gap-3 overflow-hidden">
          <button onclick="toggleMobileSidebar()" class="md:hidden text-amber-400 hover:text-amber-300 p-2 rounded-xl bg-slate-800/80 border border-amber-500/20 shrink-0">
            <i class="fa-solid fa-bars text-sm"></i>
          </button>
          <h1 id="page-title" class="text-sm md:text-base font-black text-amber-300/90 truncate tracking-wide">ပင်မစာမျက်နှာ</h1>
        </div>

        <div class="text-[11px] md:text-xs font-bold text-amber-300 bg-[#070d18] border border-amber-500/30 px-3.5 py-1.5 rounded-xl shrink-0 shadow-inner flex items-center gap-1.5 font-mono tracking-wide">
          <span class="text-slate-400">Date:</span>
          <span id="header-live-datetime" class="text-amber-300 font-extrabold">Mon 10 Aug 26 | 10:35 pm</span>
          <span class="text-amber-500/60 font-black mx-1">|</span>
          <span id="live-user-name" class="text-emerald-400 font-extrabold">Admin</span>
        </div>
      </header>

      <main class="flex-1 p-4 md:p-6 overflow-y-auto relative bg-[#090d16]">
        <div id="view-container" class="max-w-7xl mx-auto w-full"></div>
      </main>
    </div>

  </div>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[150] flex flex-col items-center justify-center hidden">
    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-amber-400 mb-3"></div>
    <p class="text-xs font-bold text-amber-200 tracking-wide">ဆောင်ရွက်နေပါသည် ခဏစောင့်ပါ...</p>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none"></div>

  <script>
    function toggleMobileSidebar() {
      var sb = document.getElementById('main-sidebar');
      var bd = document.getElementById('sidebar-backdrop');
      if (!sb) return;
      if (sb.classList.contains('-translate-x-full')) {
        sb.classList.remove('-translate-x-full');
        if (bd) bd.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        if (bd) bd.classList.add('hidden');
      }
    }

    function startHeaderClock() {
      function updateClock() {
        const datetimeEl = document.getElementById('header-live-datetime');
        if (!datetimeEl) return;
        
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const dayName = days[now.getDay()];
        const dateNum = String(now.getDate()).padStart(2, '0');
        const monthName = months[now.getMonth()];
        const yearShort = String(now.getFullYear()).slice(-2);

        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const hoursStr = String(hours).padStart(2, '0');

        datetimeEl.textContent = `${dayName} ${dateNum} ${monthName} ${yearShort} | ${hoursStr}:${minutes} ${ampm}`;
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    // 💡 Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('PWA ServiceWorker registered successfully:', reg.scope);
        }).catch(function(err) {
          console.log('PWA ServiceWorker registration failed:', err);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', startHeaderClock);
  </script>

  <!-- Script Inclusions -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/leaders.js"></script>
  <script src="js/yogi.js"></script>
  <script src="js/yogi-summary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
