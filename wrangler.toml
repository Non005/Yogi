name = "yogi-list"
main = "worker.js"
compatibility_date = "2024-11-01"

# D1 Database binding — must match the "yogi" database you already created
[[d1_databases]]
binding = "DB"
database_name = "yogi"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# CORS is handled inside worker.js, no extra config needed here.
