<!-- views/yogi.html — Yogi Stages Management Template --> 

<div class="space-y-5 view-panel">
  <!-- Top 3 KPI Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="yogi-kpi-cards">
    <div class="stats-card">
      <div class="bg-amber-500/10 text-amber-400 border border-amber-500/20">
        <i class="fa-solid fa-users"></i>
      </div>
      <div>
        <p>TOTAL ACTIVE</p>
        <h3 class="text-amber-400" id="yogi-total-active">0 ဦး</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        <i class="fa-solid fa-mars"></i>
      </div>
      <div>
        <p>ACTIVE MALE</p>
        <h3 class="text-indigo-400" id="yogi-active-male">0 ဦး</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="bg-pink-500/10 text-pink-400 border border-pink-500/20">
        <i class="fa-solid fa-venus"></i>
      </div>
      <div>
        <p>ACTIVE FEMALE</p>
        <h3 class="text-pink-400" id="yogi-active-female">0 ဦး</h3>
      </div>
    </div>
  </div>

  <!-- Action Control Bar -->
  <div class="flex flex-col md:flex-row items-center justify-between gap-3 bg-[#0e172a] p-3.5 rounded-2xl border border-amber-500/20 shadow-md">
    <div class="relative w-full md:w-80">
      <input type="text" id="yogi-search-input" onkeyup="filterYogiTable()" placeholder="အမည် / ဖုန်း / လိပ်စာ ရှာဖွေရန်..." 
        class="w-full pl-9 pr-3 py-2 bg-[#070a12] border border-amber-500/30 rounded-xl text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/20">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
    </div>

    <div class="flex flex-wrap items-center justify-between md:justify-end gap-2.5 w-full md:w-auto">
      <button onclick="renderYogiStage(1, 1, '')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold border border-slate-700/60 flex items-center gap-1.5 transition active:scale-95" title="ပြန်လည်ရယူပါ">
        <i class="fa-solid fa-rotate text-xs"></i> <span>Refresh</span>
      </button>

      <button onclick="exportYogiToExcel(1)" class="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 transition active:scale-95" title="Excel ထုတ်ယူမည်">
        <i class="fa-solid fa-file-excel text-xs"></i> <span>Export Excel</span>
      </button>

      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold px-3 py-2 rounded-xl text-xs cursor-pointer flex items-center gap-1.5 transition active:scale-95">
        <i class="fa-solid fa-file-import text-amber-400 text-xs"></i> <span>Import</span>
        <input type="file" id="yogi-file-import" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">
      </label>

      <button id="btn-add-yogi" onclick="openYogiModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg shadow-amber-500/20 transition active:scale-95">
        <i class="fa-solid fa-plus text-xs"></i> <span>+ Add New</span>
      </button>
    </div>
  </div>

  <!-- Yogi Table (14 Columns Exact) -->
  <div class="bg-[#0e172a] border border-amber-500/20 rounded-2xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr>
            <th>စဉ်</th>
            <th>ရက်စွဲ</th>
            <th>အမည်</th>
            <th class="text-center">အသက်</th>
            <th class="font-mono">ဖုန်းနံပါတ်</th>
            <th>နေရပ်လိပ်စာ</th>
            <th>မိတ်ဆက်ယောဂီ</th>
            <th>EMAIL</th>
            <th class="text-center">GENDER</th>
            <th>CREATED BY</th>
            <th>CREATED AT</th>
            <th class="font-mono">UNIQUEID</th>
            <th class="text-center">STATUS</th>
            <th class="text-center sticky right-0">ACTION</th>
          </tr>
        </thead>
        <tbody id="yogi-table-tbody" class="divide-y divide-slate-800/60">
          <!-- JS မှတစ်ဆင့် Dynamic Render သွားမည် -->
        </tbody>
      </table>
    </div>
  </div>
</div>
