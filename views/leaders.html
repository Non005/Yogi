<!-- views/leaders.html — Leader Discussion Yogis Template -->
<div class="space-y-4">
  <!-- Action Control Bar -->
  <div class="flex flex-wrap items-center justify-between gap-3 bg-[#0e172a] p-4 rounded-2xl border border-slate-800">
    <button id="btn-add-leader" onclick="openLeaderModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition active:scale-95 shadow-lg shadow-indigo-600/10">
      <i class="fa-solid fa-user-tie"></i> ဦးဆောင်ယောဂီ အသစ်ထည့်မည်
    </button>
    
    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="relative w-full md:w-64">
        <input type="text" id="leader-search-input" onkeyup="filterLeaderTable()" placeholder="အမည် / ဖုန်း ရှာပါ..." class="w-full pl-9 pr-3 py-2 bg-[#070a12] border border-slate-700/60 rounded-xl text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400/20">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
      </div>
      <div class="text-xs text-slate-400 font-bold whitespace-nowrap">
        စုစုပေါင်း: <span id="leader-count-badge" class="text-indigo-400 font-black">0</span> ဦး
      </div>
    </div>
  </div>

  <!-- Leaders Table -->
  <div class="bg-[#0e172a] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-[#070a12] text-slate-400 font-bold border-b border-slate-800 uppercase tracking-wider">
          <tr>
            <th class="p-3">စဉ် / ရက်စွဲ</th>
            <th class="p-3">အမည်</th>
            <th class="p-3">အသက်</th>
            <th class="p-3">ကျား/မ</th>
            <th class="p-3">ဖုန်းနံပါတ်</th>
            <th class="p-3">နေရပ်လိပ်စာ</th>
            <th class="p-3 text-center">Status</th>
            <th class="p-3 text-center sticky right-0">Action</th>
          </tr>
        </thead>
        <tbody id="leader-table-tbody" class="divide-y divide-slate-800/60">
          <!-- JS မှတစ်ဆင့် Dynamic Render သွားမည် -->
        </tbody>
      </table>
    </div>
  </div>
</div>
