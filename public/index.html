<!DOCTYPE html>
<html lang="my" class="dark not-authed">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom ယောဂီစာရင်း စီမံခန့်ခွဲမှုစနစ်</title>
  <script>
    (function () {
      var token = localStorage.getItem('yogi_auth_token');
      var expiresAt = Number(localStorage.getItem('yogi_token_expires_at') || 0);
      var valid = token && expiresAt && Date.now() < expiresAt;
      document.documentElement.className = valid ? 'dark is-authed' : 'dark not-authed';
    })();
  </script>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230c1322'/><path d='M50 20 L90 38 L50 56 L10 38 Z' fill='%23fbbf24'/><path d='M25 46.5 V65 C25 75 75 75 75 65 V46.5' fill='none' stroke='%23fbbf24' stroke-width='6' stroke-linecap='round'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans Myanmar', 'ui-sans-serif', 'system-ui'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/style.css">

  <style>
    html.is-authed #login-overlay { display: none !important; }
    html.is-authed #erp-workspace { display: flex !important; }
    html.not-authed #login-overlay { display: flex !important; }
    html.not-authed #erp-workspace { display: none !important; }
  </style>
</head>

<body class="bg-[#090d16] font-sans flex h-screen overflow-hidden text-slate-300">

  <!-- Login Overlay -->
  <div id="login-overlay" class="fixed inset-0 bg-[#090d16] z-[100] flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-[#0e131f]/90 border border-amber-500/20 backdrop-blur-xl rounded-3xl p-8 shadow-[0_20px_50px_rgba(0,0,0,0.8)] text-center overflow-hidden space-y-6">
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-center">
        <div class="inline-flex items-center justify-center p-4 rounded-2xl bg-gradient-to-b from-amber-500/15 to-amber-600/5 border border-amber-500/30 shadow-inner mb-3">
          <i class="fa-solid fa-dharmachakra text-4xl text-amber-400 filter drop-shadow-[0_2px_8px_rgba(245,158,11,0.5)]"></i>
        </div>
        <h2 class="text-xl font-black tracking-tight mb-1 bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">Zoom ပဋ္ဌာန်း မိသားစု</h2>
        <p class="text-[11px] font-extrabold uppercase tracking-[0.2em] text-amber-200/70 pb-3 border-b border-amber-500/10">တရားဆွေးနွေးပွဲ · ယောဂီများ စီမံခန့်ခွဲမှု</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs text-left">
        <div>
          <label class="block font-bold text-[11px] text-slate-300 uppercase tracking-widest mb-1.5">Select Role / User</label>
          <select id="login-username" required
            class="w-full p-3 bg-[#070a12]/80 border border-slate-700/60 rounded-xl text-xs text-slate-100 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/20 transition font-bold">
          </select>
        </div>
        <div>
          <label class="block font-bold text-[11px] text-slate-300 uppercase tracking-widest mb-1.5">Password</label>
          <input type="password" id="login-password" required placeholder="လျှို့ဝှက်နံပါတ် ရိုက်ထည့်ပါ..."
            class="w-full p-3 bg-[#070a12]/80 border border-slate-700/60 rounded-xl text-xs text-slate-100 placeholder:text-slate-600 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/20 transition">
        </div>
        <div id="login-error" class="hidden text-rose-400 font-semibold text-[11px] bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-xl text-center"></div>
        <button type="submit"
          class="w-full py-3.5 mt-2 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 text-xs tracking-wider active:scale-[0.99]">
          <span>စနစ်အတွင်းသို့ ဝင်မည်</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-medium text-slate-400">System Ready</span>
        </div>
        <span class="font-mono text-slate-500">v1.0</span>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="erp-workspace" class="hidden h-full w-full">
    <aside class="w-64 bg-[#0c1322] border-r border-slate-800 flex flex-col h-full shadow-2xl shrink-0">
      <div class="h-[64px] px-4 border-b border-slate-800 flex items-center justify-between text-slate-200 bg-[#0e172a] shrink-0">
        <div class="flex items-center gap-2.5 font-extrabold text-sm tracking-wide">
          <i class="fa-solid fa-dharmachakra text-amber-400 text-lg"></i>
          <span class="text-slate-100">Zoom ယောဂီစာရင်း</span>
        </div>
        <button onclick="handleLogout()" class="text-slate-500 hover:text-rose-400 transition p-1.5 rounded-lg" title="Logout">
          <i class="fa-solid fa-power-off text-xs"></i>
        </button>
      </div>
      <nav class="flex-1 px-2.5 py-2.5 space-y-0.5 overflow-y-auto" id="sidebar-nav"></nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-[#0c1322] border-b border-slate-800 h-[64px] px-6 flex justify-between items-center z-10 shrink-0">
        <h1 id="page-title" class="text-base md:text-lg font-extrabold text-slate-100 tracking-wide">ပင်မစာမျက်နှာ</h1>
        <div class="text-xs font-bold text-emerald-400 bg-[#111c44] border border-emerald-500/20 px-3.5 py-1.5 rounded-lg">
          User: <span id="live-user-name">-</span>
        </div>
      </header>
      <main class="p-6 overflow-y-auto flex-1 bg-[#090d16] relative">
        <div id="view-container"></div>
      </main>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[150] flex flex-col items-center justify-center hidden">
    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500 mb-3"></div>
    <p class="text-xs font-bold text-slate-200 tracking-wide">ဆောင်ရွက်နေပါသည် ခဏစောင့်ပါ...</p>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/yogi.js"></script>
  <script src="js/leaders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
